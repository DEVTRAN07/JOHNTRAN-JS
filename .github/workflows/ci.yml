name: CI

# Keep only the newest run for each branch; a stuck older run must not
# occupy the available runner and block verification of newer commits.
concurrency:
  group: johntran-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: node scripts/test-commands.js
      - run: node scripts/test-all.js
      - name: Benchmark hot command paths
        run: npm run benchmark:hotpath
      - name: Render actual canvas previews
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/unified-canvas') || startsWith(github.head_ref, 'design/canvas-unified-menu-style') || startsWith(github.head_ref, 'feat/canvas-show-more-photo-anti-single-message') || startsWith(github.head_ref, 'fix/caro-self-input-selection-recall') || startsWith(github.head_ref, 'fix/caro-larger-cells') || startsWith(github.head_ref, 'fix/random-text-complete-main-sync')))
        run: node scripts/render-canvas-previews.js
      - name: Upload canvas preview images
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/unified-canvas') || startsWith(github.head_ref, 'design/canvas-unified-menu-style') || startsWith(github.head_ref, 'feat/canvas-show-more-photo-anti-single-message') || startsWith(github.head_ref, 'fix/caro-self-input-selection-recall') || startsWith(github.head_ref, 'fix/caro-larger-cells') || startsWith(github.head_ref, 'fix/random-text-complete-main-sync')))
        uses: actions/upload-artifact@v4
        with:
          name: johntran-canvas-previews
          path: artifacts/canvas-preview/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Render
    needs: test
    # Chỉ deploy khi push lên main (không deploy trên PR)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy and verify live health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_NAME: JOHNTRAN-JS
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "::error::GitHub Actions secret RENDER_API_KEY is not configured."
            exit 1
          fi

          services="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?limit=100")"
          service_id="$(jq -r --arg name "$SERVICE_NAME" '
            [.. | objects | select(.name? == $name) | .id? // empty] | unique
            | if length == 1 then .[0] else "" end
          ' <<< "$services")"
          if [[ -z "$service_id" ]]; then
            service_names="$(jq -r '[.. | objects | .name? | select(type == "string")] | unique | join(", ")' <<< "$services")"
            echo "::error::Could not identify exactly one Render service named ${SERVICE_NAME}. Visible service names: ${service_names:-none}"
            exit 1
          fi

          deploy_response="$(curl --fail --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${GITHUB_SHA}\"}" \
            "https://api.render.com/v1/services/${service_id}/deploys")"
          deploy_id="$(jq -r '.id // empty' <<< "$deploy_response")"
          if [[ -z "$deploy_id" ]]; then
            echo "Render accepted the deploy without returning an ID (queued behind another deploy); looking up the requested commit."
            for attempt in $(seq 1 30); do
              deploys="$(curl --fail --silent --show-error --max-time 20 \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${service_id}/deploys?limit=20")"
              deploy_id="$(jq -r --arg sha "${GITHUB_SHA}" '
                [.[] | .deploy? | select(.commit.id? == $sha) | .id?] | first // empty
              ' <<< "$deploys")"
              if [[ -n "$deploy_id" ]]; then break; fi
              echo "Waiting for Render to register queued commit $GITHUB_SHA ($attempt/30)."
              sleep 5
            done
          fi
          if [[ -z "$deploy_id" ]]; then
            echo "::error::Could not find a Render deployment for commit $GITHUB_SHA."
            exit 1
          fi
          echo "Render deploy ID: $deploy_id"

          deploy_status=""
          for attempt in $(seq 1 90); do
            deploy="$(curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${service_id}/deploys/${deploy_id}")"
            deploy_status="$(jq -r '.status // empty' <<< "$deploy")"
            echo "Render deploy check $attempt/90: ${deploy_status:-unknown}"

            if [[ "$deploy_status" == "live" ]]; then
              break
            fi
            case "$deploy_status" in
              build_failed|pre_deploy_failed|update_failed|canceled|deactivated)
                echo "::error::Render deployment ended with status: $deploy_status"
                echo "$deploy"
                exit 1
                ;;
            esac
            sleep 10
          done

          if [[ "$deploy_status" != "live" ]]; then
            echo "::error::Render deploy did not reach live state within 15 minutes (last status: ${deploy_status:-unknown})."
            exit 1
          fi

          service_details="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${service_id}")"
          service_url="$(jq -r '.serviceDetails.url // empty' <<< "$service_details")"
          if [[ -z "$service_url" ]]; then
            echo "::error::Render service did not return a public serviceDetails.url."
            exit 1
          fi
          # The Render service env-vars endpoint exposes direct service vars only;
          # linked Environment Group values are intentionally not returned by this API.
          direct_env_vars="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${service_id}/env-vars?limit=100")"
          persistent_dir="$(jq -r '[.[] | .envVar? | select(.key == "JT_PERSISTENT_DIR") | .value] | first // empty' <<< "$direct_env_vars")"
          if [[ "$persistent_dir" == "/opt/render/project/data" ]]; then
            echo "PASS  direct Render JT_PERSISTENT_DIR matches the Blueprint Persistent Disk mount."
          else
            echo "::warning::JT_PERSISTENT_DIR was not confirmed as a direct service variable with the expected mount path. The API omits linked Environment Group variables; sync the Blueprint or inspect Render Dashboard → Environment before assuming registry/child-bot logs are persistent."
          fi

          echo "Verifying public health endpoint: $service_url/health"

          healthy=0
          for attempt in $(seq 1 12); do
            if health="$(curl --fail --silent --show-error --max-time 10 "$service_url/health" 2>/dev/null)"; then
              if jq -e '(.status == "ok" or .status == "starting") and ((.uptimeMs | type) == "number" or (.uptimeSeconds | type) == "number")' >/dev/null <<< "$health"; then
                echo "PASS  public /health: status=$(jq -r '.status' <<< "$health"), loggedIn=$(jq -r '.loggedIn // false' <<< "$health")"
                if jq -e '.botSummary | type == "object"' >/dev/null <<< "$health"; then
                  echo "Panel bots: total=$(jq -r '.botSummary.total' <<< "$health"), running=$(jq -r '.botSummary.running' <<< "$health"), loggedIn=$(jq -r '.botSummary.loggedIn' <<< "$health"), waitingLogin=$(jq -r '.botSummary.waitingLogin' <<< "$health"), failed=$(jq -r '.botSummary.failed' <<< "$health")"
                fi
                db_driver="$(jq -r '.supabase.driver // "unknown"' <<< "$health")"
                db_ok="$(jq -r '.supabase.ok // false' <<< "$health")"
                db_failures="$(jq -r '.supabase.consecutiveFailures // 0' <<< "$health")"
                if [[ "$db_driver" == "supabase" && "$db_ok" == "true" ]]; then
                  echo "PASS  database: driver=supabase, sync=healthy, consecutiveFailures=$db_failures"
                elif [[ "$db_driver" == "supabase" ]]; then
                  echo "::warning::Database driver is Supabase but sync is not healthy yet (consecutiveFailures=$db_failures). Check Panel → Hệ thống → Database and Supabase SQL schema/credentials."
                elif [[ "$db_driver" == "json" ]]; then
                  echo "::warning::Production is still using JSON, not Supabase. Add SUPABASE_URL and SUPABASE_SECRET_KEY in Render Environment, and remove JT_DB_DRIVER=json/SUPABASE_DISABLE=true."
                else
                  echo "::warning::Could not determine database driver from public health payload."
                fi
                if [[ "$(jq -r '.loggedIn // false' <<< "$health")" != "true" ]]; then
                  echo "::warning::The service is live but no managed Zalo bot session is logged in yet (loggedIn=false). Check the Panel bot QR/login state before expecting chat/group features to work."
                fi
                healthy=1
                break
              fi
              echo "Health endpoint returned an unexpected payload; retry $attempt/12."
            else
              echo "Health endpoint is not ready yet; retry $attempt/12."
            fi
            sleep 5
          done

          if [[ "$healthy" -ne 1 ]]; then
            echo "::error::Render deployment is live, but the public /health endpoint did not return a valid health payload."
            exit 1
          fi
          echo "PASS  Render deployment ${deploy_id} is live for commit ${GITHUB_SHA}."
