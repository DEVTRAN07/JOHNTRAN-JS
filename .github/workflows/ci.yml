name: CI

# Keep only the newest run for each branch; a stuck older run must not
# occupy the available runner and block verification of newer commits.
concurrency:
  group: johntran-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The remote photo host is not part of CI. Avoid unstable third-party
      # JPEG decoding while testing local Canvas renderers with the gradient.
      JT_CANVAS_DISABLE_REMOTE_BACKGROUNDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust command parser
        run: cargo test --manifest-path native/Cargo.toml -p command-core-rs
      - name: Test Rust game-domain engine
        run: cargo test --manifest-path native/Cargo.toml -p game-core-rs
      - name: Test Rust domain policies
        run: cargo test --manifest-path native/Cargo.toml -p domain-core-rs
      - name: Compile and test Rust message-cache sidecar
        run: |
          cargo test --manifest-path rust/message-cache/Cargo.toml
          npm run build:message-cache
      - name: Build Rust sticker N-API addon
        run: |
          npm run build:native
          node -e "const addon = require('./native/sticker-rs/sticker_rs.node'); if (typeof addon.composeStaticSticker !== 'function' || typeof addon.composeStaticStickerProfiles !== 'function' || typeof addon.composeStaticCircleSticker !== 'function') throw new Error('Rust sticker addon export missing')"
          node -e "const native = require('./native'); if (!native.nativeAvailable.commandParser) throw new Error('Rust command parser addon was not loaded'); const parsed = native.parseCommand('/scl  Sơn Tùng', '/'); if (parsed.command !== 'scl' || parsed.args.join('|') !== 'Sơn|Tùng') throw new Error('Rust command parser smoke test failed')"
      - name: Build Rust text colorizer used by live message path
        run: |
          cargo test --manifest-path native/text-style-rs/Cargo.toml
          cargo build --manifest-path native/text-style-rs/Cargo.toml --release
          cp native/text-style-rs/target/release/libtext_style_rs.so native/text-style-rs/text_style_rs.node
      - name: Smoke test Rust Caro N-API addon
        run: node -e 'const native = require("./native"); if (!native.getGameCoreDiagnostics().active) throw new Error("Rust game core addon was not activated"); const result = native.tryCaroChooseAiMove(Array(256).fill(null), "O"); if (!result.used || !Number.isInteger(result.value)) throw new Error("Rust Caro engine smoke test failed")'
      - name: Smoke test Rust Nối Từ text engine
        run: node -e 'const native = require("./native"); if (!native.getNoituEngineDiagnostics().active) throw new Error("Rust Nối Từ functions were not activated"); if (native.tryNoituNormalizePhrase("VIÊN CHỨC!").value !== "vien chuc") throw new Error("Rust Nối Từ normalization failed"); const phrase = native.tryNoituParsePhrase("ĐIỆN-thoại").value; if (!phrase || phrase.normalized !== "dien thoai") throw new Error("Rust Nối Từ phrase parser failed")'
      - name: Smoke test Rust Sâm card engine
        run: node -e 'const native = require("./native"); if (!native.getSamEngineDiagnostics().active) throw new Error("Rust Sâm functions were not activated"); const deck = native.trySamOperation("sam_create_deck", []).value; if (!Array.isArray(deck) || deck.length !== 52) throw new Error("Rust Sâm deck generation failed"); const combo = native.trySamOperation("sam_analyze_combo", [[{rank:3,suit:"b",id:"3b"},{rank:3,suit:"r",id:"3r"}]]).value; if (!combo || (combo.comboType || combo.combo_type) !== "pair") throw new Error("Rust Sâm combo analysis failed")'
      - name: Smoke test Rust Tiến Lên rules
        run: node -e 'const native = require("./native"); if (!native.getTlmnEngineDiagnostics().active) throw new Error("Rust Tiến Lên functions were not activated"); const deck = native.tryTlmnOperation("tlmn_create_deck", []).value; if (!Array.isArray(deck) || deck.length !== 52) throw new Error("Rust Tiến Lên deck generation failed"); const cards = [3,4,5].flatMap(rank => [{rank,suit:"b",id:String(rank)+"b"},{rank,suit:"c",id:String(rank)+"c"}]); const combo = native.tryTlmnOperation("tlmn_analyze_combo", [cards]).value; if (!combo || (combo.comboType || combo.combo_type) !== "pairRun" || combo.length !== 3) throw new Error("Rust Tiến Lên pair-run analysis failed")'
      - name: Smoke test Rust group-state domain engine
        run: node -e 'const native = require("./native"); if (!native.getGroupStateDiagnostics().active) throw new Error("Rust domain-core addon was not activated"); if (!native.tryGroupStateOperation("group_is_allowed_control", [" BOT ", "STATUS"]).value) throw new Error("Group control policy failed"); const flags = native.tryGroupStateOperation("group_enabled_flags", [["g1"], ["g1", "g2"]]).value; if (String(flags) !== "true,false") throw new Error("Group enabled flags failed")'
      - name: Smoke test Rust requester-greeting policy
        run: node -e 'const native = require("./native"); if (!native.getRequesterGreetingDiagnostics().active) throw new Error("Rust requester-greeting policy was not activated"); const role = native.tryRequesterOperation("requester_role", ["owner-1", "", ["owner-1"], ["admin-2"], ["support-1"], []]); if (!role.used || role.value !== "owner") throw new Error("Rust requester role priority failed"); const ids = native.tryRequesterOperation("requester_get_admin_ids", [[" owner ", "admin"], ["admin", "runtime"]]); if (String(ids.value) !== "owner,admin,runtime") throw new Error("Rust requester admin ID normalization failed")'
      - name: Smoke test Rust Anti-protection state engine
        run: node -e 'const native = require("./native"); if (!native.getAntiProtectionDiagnostics().active) throw new Error("Rust Anti-protection functions were not activated"); const keys = native.tryAntiProtectionOperation("anti_protection_keys", []).value; if (!Array.isArray(keys) || keys.length !== 21 || keys[0] !== "anti_nude") throw new Error("Anti-protection key schema failed"); if (!native.tryAntiProtectionOperation("anti_is_supported_feature", ["anti_qr"]).value) throw new Error("Anti-protection feature validation failed"); const state = native.tryAntiProtectionOperation("anti_protection_state", [[true, false]]).value; if (!state || state.length !== 21 || state[0].enabled !== true || state[1].enabled !== false) throw new Error("Anti-protection state mapping failed")'
      - name: Smoke test Rust permission policy
        run: node -e 'const native = require("./native"); if (!native.getPermissionPolicyDiagnostics().active) throw new Error("Rust permission policy was not activated"); const denied = native.tryPermissionPolicyOperation("permission_check_command_role", [true, false, false, false]); if (!denied.used || denied.value !== true) throw new Error("Command role policy failed"); const decision = native.tryPermissionPolicyOperation("permission_evaluate_group", [false, false, true, true, false, false, false]); if (!decision.used || decision.value !== 2) throw new Error("Group permission priority failed"); const state = native.tryPermissionPolicyOperation("permission_resolve_group_admin_state", [true, true, false, true]); if (!state.used || state.value !== 1) throw new Error("Group admin trit resolution failed")'
      - name: Smoke test Rust restart backoff policy
        run: node -e 'const native = require("./native"); if (!native.getRestartPolicyDiagnostics().active) throw new Error("Rust restart policy was not activated"); const result = native.tryRestartPlan([[], 1000, 600000, 5, 1000, 15000]); const plan = result.value || {}; const delay = plan.delayMs ?? plan.delay_ms; if (!result.used || plan.attempts !== 1 || delay !== 1000 || plan.cooldown !== false) throw new Error("Rust restart backoff calculation failed")'
      - name: Smoke test Rust HTTP request policy
        run: node -e 'const native = require("./native"); if (!native.getHttpRequestPolicyDiagnostics().active) throw new Error("Rust HTTP request policy was not activated"); const result = native.tryResolveHttpRequestPolicy([3000,true,5000,true,1,true,0,true,120,true,900,true]); const value = result.value || {}; const timeout = value.timeoutMs ?? value.timeout_ms; const delay = value.delayMs ?? value.delay_ms; if (!result.used || timeout !== 5000 || value.retries !== 0 || delay !== 120) throw new Error("Rust HTTP request policy calculation failed")'
      - name: Smoke test Rust sliding-window limiter
        run: node -e 'process.env.JT_RUST_RATE_LIMITER = "1"; const native = require("./native"); if (!native.getRateLimiterDiagnostics().active || typeof native.NativeSlidingWindowLimiter !== "function") throw new Error("Rust sliding-window limiter class was not activated"); const limiter = new native.NativeSlidingWindowLimiter(10000, 2, 10); if (!limiter.allow("u1", 1000) || !limiter.allow("u1", 2000) || limiter.allow("u1", 3000)) throw new Error("Rust sliding-window decision failed"); limiter.prune(50000, false); limiter.clear(); if (limiter.size !== 0) throw new Error("Rust sliding-window clear failed")'
      # Keep the broad legacy suite lightweight; the real JSON writer is
      # exercised in its own isolated, bounded test process below.
      - name: Run Node test suite without per-test JSON workers
        env:
          JT_JSON_WRITER_WORKER: "0"
        run: npm test
      - name: Verify background JSON writer worker
        env:
          JT_JSON_WRITER_WORKER: "1"
        run: timeout 90s node --test --test-force-exit tests/jsonStoreWorker.test.js
      - run: node scripts/test-commands.js
      - run: node scripts/test-all.js
      - name: Benchmark hot command paths
        run: npm run benchmark:hotpath
      - name: Render actual canvas previews
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/unified-canvas') || startsWith(github.head_ref, 'design/canvas-unified-menu-style') || startsWith(github.head_ref, 'feat/canvas-show-more-photo-anti-single-message') || startsWith(github.head_ref, 'fix/caro-self-input-selection-recall') || startsWith(github.head_ref, 'fix/caro-larger-cells') || startsWith(github.head_ref, 'fix/random-text-complete-main-sync') || startsWith(github.head_ref, 'fix/random-text-final')))
        run: node scripts/render-canvas-previews.js
      - name: Upload canvas preview images
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/unified-canvas') || startsWith(github.head_ref, 'design/canvas-unified-menu-style') || startsWith(github.head_ref, 'feat/canvas-show-more-photo-anti-single-message') || startsWith(github.head_ref, 'fix/caro-self-input-selection-recall') || startsWith(github.head_ref, 'fix/caro-larger-cells') || startsWith(github.head_ref, 'fix/random-text-complete-main-sync') || startsWith(github.head_ref, 'fix/random-text-final')))
        uses: actions/upload-artifact@v4
        with:
          name: johntran-canvas-previews
          path: artifacts/canvas-preview/
          if-no-files-found: error
          retention-days: 7
