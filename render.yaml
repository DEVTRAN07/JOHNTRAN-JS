services:
  - type: web
    name: JOHNTRAN-JS
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: JT_ACCOUNT_FILE
        value: /opt/render/project/data/account.json
      - key: JT_DB_FILE
        value: /opt/render/project/data/store.json
      - key: JT_QRCODE_PATH
        value: /opt/render/project/data/qr.png
      # Persist the bot registry, child-bot stores and error logs on the
      # same Persistent Disk already mounted above.
      - key: JT_PERSISTENT_DIR
        value: /opt/render/project/data
      # Add these two values in Render Dashboard → Environment.
      # sync:false prevents Blueprint commits from overwriting secret values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Legacy compatibility only; use SUPABASE_SECRET_KEY for new projects.
      - key: SUPABASE_SERVICE_KEY
        sync: false
    disk:
      name: bot-data
      mountPath: /opt/render/project/data
      sizeGB: 1
