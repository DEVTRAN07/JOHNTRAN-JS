services:
  - type: web
    name: john-tran-bot
    env: node
    plan: starter
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: "22.22.1"
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
    disk:
      name: bot-data
      mountPath: /opt/render/project/src
      sizeGB: 1
