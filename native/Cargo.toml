[workspace]
name = "john-tran-native"
resolver = "2"
members = [
  "sticker-rs",
]
# canvas-rs and ffmpeg-rs remain isolated prototypes until their API/ABI
# contracts and platform builds are verified. Do not compile them into the
# production addon bundle implicitly.
exclude = ["text-style-rs", "canvas-rs", "ffmpeg-rs"]

[workspace.dependencies]
napi = { version = "2" }
napi-derive = { version = "2" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
