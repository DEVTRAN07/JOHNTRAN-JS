[workspace]
name = "john-tran-native"
resolver = "2"
members = [
  "sticker-rs",
  "canvas-rs",
  "ffmpeg-rs",
  "text-style-rs",
]

[workspace.dependencies]
napi = { version = "2", features = ["derive"] }
napi-derive = { version = "2" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
