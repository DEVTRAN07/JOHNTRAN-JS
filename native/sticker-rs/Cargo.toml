[package]
name = "sticker-rs"
version = "1.1.0"
edition = "2021"
description = "Asynchronous Rust static sticker compositor and WebP encoder"

[lib]
name = "sticker_rs"
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
webp = "0.3"

[build-dependencies]
napi-build = "2"

[features]
default = []
