# Geo-routing NGINX Configuration for Edge Deployment
# Routes traffic based on client geographic location

# GeoIP database (requires ngx_http_geoip2_module)
# Download from: https://dev.maxmind.com/geoip/geoip2/geolite2/
geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
    auto_reload 6h;
    $geoip2_data_country_code country iso_code;
    $geoip2_data_country_name country names en;
}

# Map country codes to upstream regions
map $geoip2_data_country_code $upstream_region {
    default hk;
    VN vn;
    SG sg;
    MY sg;
    TH sg;
    ID sg;
    PH sg;
    MM sg;
    LA sg;
    KH sg;
    BN sg;
    TL sg;
}

# Upstream definitions for each region
upstream backend_vn {
    least_conn;
    server app-vn:3000 max_fails=3 fail_timeout=30s;
    server app-vn:3000 max_fails=3 fail_timeout=30s;  # 2nd replica
    keepalive 32;
}

upstream backend_sg {
    least_conn;
    server app-sg:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream backend_hk {
    least_conn;
    server app-hk:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# Health check endpoints for load balancer
upstream health_vn {
    server app-vn:3000;
}
upstream health_sg {
    server app-sg:3000;
}
upstream health_hk {
    server app-hk:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=health:10m rate=1000r/s;

    # Health check endpoints (no geo-routing, direct to region)
    location /health/vn {
        limit_req zone=health burst=20 nodelay;
        proxy_pass http://health_vn/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /health/sg {
        limit_req zone=health burst=20 nodelay;
        proxy_pass http://health_sg/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /health/hk {
        limit_req zone=health burst=20 nodelay;
        proxy_pass http://health_hk/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Global health check (returns current region)
    location /health {
        limit_req zone=health burst=20 nodelay;
        proxy_pass http://backend_$upstream_region/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Region $upstream_region;
        access_log off;
    }

    # Main application routing (geo-based)
    location / {
        limit_req zone=api burst=50 nodelay;
        
        # Select upstream based on geo
        proxy_pass http://backend_$upstream_region;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Region $upstream_region;
        proxy_set_header X-Country-Code $geoip2_data_country_code;
        proxy_set_header X-Country-Name $geoip2_data_country_name;
        
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Failover to next region on error
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://backend_$upstream_region;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Region $upstream_region;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Static assets (cache aggressively)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://backend_$upstream_region;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Region $upstream_region;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
